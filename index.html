<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Penjualan per wilayah dan merek, lima outlet terlemah, dan ringkasan Telegram dari ekspor CSV penjualan."
    />
    <meta name="theme-color" content="#f4f3ee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111110" media="(prefers-color-scheme: dark)" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231c5cab'/%3E%3Cpath d='M7 10h12a2 2 0 0 1 0 4H7zM7 18h18a2 2 0 0 1 0 4H7z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <title>Sales Insight</title>
    <script>
      // Before first paint: the theme and page language the viewer picked earlier (keys as in useTheme / locale.tsx).
      try {
        var t = localStorage.getItem('sales-insight-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
        var l = localStorage.getItem('sales-insight-lang');
        if (l === 'en' || l === 'id') document.documentElement.lang = l;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
